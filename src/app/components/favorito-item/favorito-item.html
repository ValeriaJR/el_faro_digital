<article class="bg-surface-container-lowest p-space-md md:p-space-lg rounded-xl shadow-sm hover:shadow-md transition-all flex flex-col md:flex-row gap-space-lg items-start md:items-center justify-between">
  <div class="flex flex-col sm:flex-row gap-space-md items-start sm:items-center w-full md:w-auto flex-1">
    <div class="relative w-full sm:w-44 h-28 rounded-lg overflow-hidden shrink-0 bg-surface-container">
      <img class="w-full h-full object-cover" [alt]="noticia().titulo" [src]="noticia().imagen" loading="lazy" />
    </div>
    <div class="flex flex-col gap-space-xxs flex-1 min-w-0">
      <div class="flex items-center gap-space-xs flex-wrap font-byline-meta text-byline-meta text-on-surface-variant">
        <span class="px-2 py-0.5 rounded-full bg-surface-container text-on-surface font-semibold">{{ noticia().categoria }}</span>
        <span>•</span>
        <span class="flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">timer</span>{{ noticia().tiempoLectura }} min lectura</span>
      </div>
      <h2 class="font-headline-md text-headline-md text-on-surface font-semibold line-clamp-2">{{ noticia().titulo }}</h2>
      <p class="font-body-sm text-body-sm text-on-surface-variant line-clamp-2">{{ noticia().resumen }}</p>
    </div>
  </div>
  <div class="flex items-center justify-between md:justify-end gap-space-sm w-full md:w-auto shrink-0 pt-space-xs md:pt-0">
    <a class="px-space-md py-space-xs bg-primary text-on-primary rounded-lg font-label-md text-label-md hover:bg-primary-container transition-colors flex items-center gap-1" [routerLink]="['/noticia', noticia().id]">
      <span>Leer ahora</span><span class="material-symbols-outlined text-[16px]">arrow_forward</span>
    </a>
    <button
      type="button"
      class="p-2 rounded-lg bg-surface-container text-on-surface-variant hover:bg-error-container hover:text-on-error-container transition-colors flex items-center justify-center"
      title="Eliminar de favoritos"
      (click)="eliminar.emit(noticia().id)"
    >
      <span class="material-symbols-outlined text-[20px]">delete</span>
    </button>
  </div>
</article>
